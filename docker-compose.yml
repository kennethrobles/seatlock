services:
  db:
    image: postgres:18
    container_name: seatlock-db
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${SEATLOCK_DB_PASSWORD:-}
    ports:
      - "5432:5432"
    volumes:
      - seatlock-data:/var/lib/postgresql

volumes:
  seatlock-data:
